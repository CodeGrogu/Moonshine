name: Windows 11 Native AddressSanitizer Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  address-sanitizer:
    name: MSVC AddressSanitizer (Windows 11)
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: '1.11.1'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure MSVC AddressSanitizer build
        shell: pwsh
        run: >
          cmake -B build-asan -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="/fsanitize=address /Zi"
          -DMOONSHINE_BUILD_TESTS=ON

      - name: Compile AddressSanitizer build
        run: cmake --build build-asan --parallel

      - name: Run native CTest suite under AddressSanitizer
        run: ctest --test-dir build-asan --output-on-failure --no-tests=error
