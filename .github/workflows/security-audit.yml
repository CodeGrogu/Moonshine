name: Security & Vulnerability Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays

jobs:
  nuget-security-scan:
    name: NuGet Dependency Vulnerability Scan
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Audit NuGet Package Vulnerabilities
        run: dotnet list package --vulnerable --include-transitive

  codeql-analysis:
    name: CodeQL Static Security Analysis (Windows 11)
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp, csharp

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: '1.11.1'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows 11 codebase for analysis
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Configuration Release -SkipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
