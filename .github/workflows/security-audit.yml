name: Security & Vulnerability Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays

jobs:
  nuget-security-scan:
    name: NuGet Dependency Vulnerability Scan
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Audit NuGet Package Vulnerabilities
        run: dotnet list package --vulnerable --include-transitive

  codeql-analysis:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp, csharp

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Codebase for Analysis
        run: |
          sudo apt-get update && sudo apt-get install -y clang ninja-build
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          dotnet build Moonshine.sln -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
