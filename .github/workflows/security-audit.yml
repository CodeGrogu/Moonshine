name: Security, Dependency & Application Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  preflight-security:
    name: Security Standards & Regression Tests
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version-file: global.json

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: '1.11.1'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify repository preflight
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\preflight.ps1

      - name: Build Release security test prerequisites
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Configuration Release

      - name: Run managed security regression tests
        shell: pwsh
        run: >
          .\tools\dotnet_sdk\dotnet.exe test tests/Moonshine.Core.Tests/Moonshine.Core.Tests.csproj
          -c Release --no-build --no-restore --arch x64
          --filter "FullyQualifiedName~Pairing|FullyQualifiedName~SecureFileStore"

      - name: Run native IPC security regression tests
        shell: pwsh
        run: >
          ctest --test-dir build/release-avx2 -C Release
          -R "test_virtual_audio_ipc"
          --output-on-failure

  dependency-audit:
    name: NuGet Dependency Vulnerability Scan
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version-file: global.json

      - name: Audit NuGet Package Vulnerabilities
        run: dotnet list package --vulnerable --include-transitive

  codeql-analysis:
    name: CodeQL Static Security Analysis (Windows 11)
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp, csharp

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version-file: global.json

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: '1.11.1'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows 11 codebase for analysis
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Configuration Release -SkipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
