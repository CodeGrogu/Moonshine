name: Moonshine Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test-windows:
    name: Windows Build (Native C++ & .NET Native AOT)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake Native Project (Release AVX2)
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DMOONSHINE_ENABLE_AVX2=ON -DMOONSHINE_BUILD_TESTS=ON

      - name: Build Native C++ Engine
        run: |
          cmake --build build --config Release --parallel

      - name: Run Native C++ Tests
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Build Managed Solution (.NET)
        run: |
          dotnet build Moonshine.sln -c Release

      - name: Run Managed Unit Tests
        run: |
          dotnet test Moonshine.sln -c Release --no-build --verbosity normal

  build-and-test-linux:
    name: Linux Build (GCC/Clang & .NET Native AOT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libasound2-dev libpulse-dev libvulkan-dev libva-dev

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Configure CMake Native Project
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DMOONSHINE_ENABLE_AVX2=ON -DMOONSHINE_BUILD_TESTS=ON

      - name: Build Native C++ Engine
        run: |
          cmake --build build --config Release --parallel

      - name: Run Native C++ Tests
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Build Managed Solution (.NET)
        run: |
          dotnet build Moonshine.sln -c Release

      - name: Run Managed Unit Tests
        run: |
          dotnet test Moonshine.sln -c Release --no-build --verbosity normal
