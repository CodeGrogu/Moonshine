name: Windows 11 Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows 11 (${{ matrix.configuration }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Release, Debug ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version-file: global.json

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: '1.11.1'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify Windows toolchain and architecture
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\verify_environment.ps1

      - name: Run repository preflight
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\preflight.ps1

      - name: Build and test canonical backend
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Configuration ${{ matrix.configuration }}

      - name: Upload standardised test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-11-test-results-${{ matrix.configuration }}
          path: ./TestResults/**
          if-no-files-found: ignore

      - name: Upload native build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-11-build-metadata-${{ matrix.configuration }}
          path: |
            ./build/${{ matrix.configuration == 'Release' && 'release-avx2' || 'debug' }}/CMakeCache.txt
            ./build/${{ matrix.configuration == 'Release' && 'release-avx2' || 'debug' }}/compile_commands.json
          if-no-files-found: ignore
