name: Windows 11 Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows 11 (${{ matrix.configuration }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Release, Debug ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: '1.11.1'

      - name: Set up MSVC C++23 environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify, build, and test Windows 11 project
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\verify_codebase.ps1 -Configuration ${{ matrix.configuration }}

      - name: Upload standardised test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-11-test-results-${{ matrix.configuration }}
          path: ./TestResults/**
          if-no-files-found: ignore
