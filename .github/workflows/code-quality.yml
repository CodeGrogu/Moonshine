name: Code Quality, Standards & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality & Standards
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version-file: global.json

      - name: Verify repository standards
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\preflight.ps1

      - name: Verify .NET formatting
        run: dotnet format Moonshine.sln --verify-no-changes --verbosity normal

      - name: Audit prohibited em dash usage
        shell: pwsh
        run: |
          $paths = @(
            "src",
            "tests",
            "scripts",
            "docs",
            "README.md",
            "KNOWN_ISSUES.md",
            "STANDARDS.md"
          )

          $files = foreach ($path in $paths) {
            if (Test-Path $path -PathType Container) {
              Get-ChildItem -Path $path -Recurse -File | Where-Object {
                $_.Extension -in '.cs', '.cpp', '.hpp', '.h', '.ps1', '.md', '.yml', '.yaml'
              }
            } elseif (Test-Path $path) {
              Get-Item $path
            }
          }

          $matches = $files | Select-String -Pattern '—' -ErrorAction SilentlyContinue
          if ($matches) {
            $matches | ForEach-Object {
              Write-Error "Disallowed em dash found in $($_.Path):$($_.LineNumber)"
            }
            throw "Em dashes are prohibited across Moonshine source and documentation."
          }

          Write-Host "Standards and typography checks passed."
