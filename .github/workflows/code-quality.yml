name: Code Quality, Style & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format-and-lint:
    name: Code Formatting & British English Audit
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Verify .NET Code Formatting
        run: dotnet format Moonshine.sln --verify-no-changes --verbosity normal

      - name: Audit Emoji & Em Dash Exclusion
        shell: pwsh
        run: |
          $emDashMatches = Select-String -Path "src/**/*.cs", "src/**/*.hpp", "src/**/*.cpp", "wiki/*.md" -Pattern "—" -ErrorAction SilentlyContinue
          if ($emDashMatches) {
              $emDashMatches | ForEach-Object { Write-Error "Disallowed em dash found in $($_.Path):$($_.LineNumber)" }
              throw "Em dashes are prohibited across Moonshine source and documentation."
          }
          Write-Host "Code quality, formatting, and typography checks passed."
