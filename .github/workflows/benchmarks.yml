name: Windows 11 Performance Benchmarking

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-benchmarks:
    name: BenchmarkDotNet on Windows 11
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: '1.11.1'

      - name: Set up MSVC C++23 environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run standardised Windows 11 benchmarks
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\run_benchmarks.ps1

      - name: Upload BenchmarkDotNet results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ./BenchmarkDotNet.Artifacts/results/*
