name: Windows 11 Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  package-release:
    name: Package Windows 11 x64 Moonshine Application
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version-file: global.json

      - name: Verify Windows toolchain
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\verify_environment.ps1

      - name: Require unified Moonshine application target
        shell: pwsh
        run: |
          $applicationProject = "src/Moonshine/Moonshine.csproj"
          if (-not (Test-Path $applicationProject)) {
            throw "Tagged releases require the unified Moonshine application target at $applicationProject. The repository is not yet ready to publish a final Host/Client application package."
          }

          "APPLICATION_PROJECT=$applicationProject" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish unified Moonshine application
        shell: pwsh
        run: >
          dotnet publish "$env:APPLICATION_PROJECT"
          -c Release
          -r win-x64
          --self-contained
          -p:PublishAot=true
          -p:TreatWarningsAsErrors=true
          -o ./dist/win-x64

      - name: Verify release artifact
        shell: pwsh
        run: |
          $executables = Get-ChildItem ./dist/win-x64 -Filter *.exe -File
          if ($executables.Count -ne 1) {
            throw "Expected exactly one final Moonshine executable, found $($executables.Count)."
          }

          Write-Host "Final application: $($executables[0].FullName)"

      - name: Package Windows 11 x64 release
        shell: pwsh
        run: |
          $archiveName = "moonshine-win-x64.zip"
          Compress-Archive -Path ./dist/win-x64/* -DestinationPath ./$archiveName
          $hash = (Get-FileHash ./$archiveName -Algorithm SHA256).Hash
          "$hash  $archiveName" | Out-File -FilePath ./$archiveName.sha256 -Encoding ascii

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./moonshine-win-x64.zip
            ./moonshine-win-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
