name: Windows 11 Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  package-release:
    name: Package Windows 11 x64 Release
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Windows 11 Native AOT executable
        run: >
          dotnet publish src/Moonshine.Client/Moonshine.Client.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishAot=true
          -o ./dist/win-x64

      - name: Package Windows 11 artifacts
        shell: pwsh
        run: |
          $archiveName = "moonshine-win-x64.zip"
          Compress-Archive -Path ./dist/win-x64/* -DestinationPath ./$archiveName
          $hash = (Get-FileHash ./$archiveName -Algorithm SHA256).Hash
          "$hash  $archiveName" | Out-File -FilePath ./$archiveName.sha256 -Encoding ascii

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./moonshine-win-x64.zip
            ./moonshine-win-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
